name: Validate public badge registry

on:
  pull_request:
    paths:
      - "assets/data/badges-public.json"
      - "assets/badges/**"
      - "schema/badges-public.schema.json"
      - "scripts/validate_badges.py"
      - ".github/workflows/validate-badges.yml"
  push:
    branches:
      - gh-pages
      - paciobadge
    paths:
      - "assets/data/badges-public.json"
      - "assets/badges/**"
      - "schema/badges-public.schema.json"
      - "scripts/validate_badges.py"
      - ".github/workflows/validate-badges.yml"

jobs:
  validate-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate public badge registry
        run: python scripts/validate_badges.py
